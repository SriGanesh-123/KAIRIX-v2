[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kairix"
version = "1.0.0"
description = "Legacy Reverse Engineering & Knowledge Extraction Platform"
readme = "README.md"
requires-python = ">=3.10, <=3.12"
dependencies = [
    "tree-sitter==0.26.0",
    "tree-sitter-language-pack==1.14.3",
    "tree-sitter-languages>=1.10.2",
    "tree-sitter-sql>=0.3.11",
    "sqlglot>=25.0.0",
    "lxml>=5.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "neo4j>=5.0.0",
    "qdrant-client>=1.9.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
